spring.application.name=ferreteria-categorias
server.port=8084

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferreteria_categorias?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:ferreteria_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:ferreteria-auth}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}