spring.application.name=ferreteria-contacto
server.port=8089

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferreteria_contacto?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:estaEsUnaClaveSecretaMuyLargaParaFirmarTokensJwtEnFerreteria2026==}
app.jwt.issuer=${JWT_ISSUER:ferreteria-auth}
app.jwt.expiration-ms=3600000
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
logging.level.org.springframework.security=DEBUG