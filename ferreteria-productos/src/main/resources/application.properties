# PUERTO DEL MICROSERVICIO DE PRODUCTOS
server.port=8085

# NOMBRE DE LA APLICACIÓN
spring.application.name=ferreteria-productos

# CONEXIÓN A LA BASE DE DATOS MYSQL (Crea la base automáticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria_productos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIBERNATE / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CONFIGURACIÓN DE SEGURIDAD (JWT)
app.jwt.secret=${JWT_SECRET:estaEsUnaClaveSecretaMuyLargaParaFirmarTokensJwtEnFerreteria2026==}
app.jwt.issuer=${JWT_ISSUER:ferreteria-auth}
app.jwt.expiration-ms=3600000
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
logging.level.org.springframework.security=DEBUG