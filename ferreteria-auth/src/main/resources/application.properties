spring.application.name=ferreteria-auth

server.port=8081

# Base de datos propia
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferreteria_auth?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT: misma clave y emisor en todos los microservicios
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:ferreteria-auth}
app.jwt.expiration-ms=${JWT_ACCESS_TTL_MS:900000}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_TTL_SECONDS:604800}

# Origen del frontend React permitido por CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
