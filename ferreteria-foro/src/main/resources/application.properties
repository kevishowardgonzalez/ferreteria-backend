spring.application.name=ferreteria-auth
server.port=8081

# Base de datos propia: solo credenciales (correo, password BCrypt, rol, activo)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferreteria_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:ferreteria_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT: misma clave y emisor en todos los microservicios
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:ferreteria-auth}
app.jwt.expiration-ms=86400000

# Origen del frontend React
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.seed.password=${AUTH_SEED_PASSWORD:}